name: Build Hykon Solar Neo APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HykonSolar-Neo-Complete-Redesign-FRESH.zip'
      - '.github/workflows/build-hykon-solar-neo.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Check and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="HykonSolar-Neo-Complete-Redesign-FRESH.zip"
          test -f "$ZIP_FILE" || { echo "::error::ZIP not found at repository root: $ZIP_FILE"; exit 1; }
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source
          PROJECT_DIR="$(find source -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR" || { echo "::error::Could not find settings.gradle.kts inside ZIP"; find source -maxdepth 4 -type f; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"
          test -f "$PROJECT_DIR/app/build.gradle.kts" || { echo "::error::app/build.gradle.kts not found"; exit 1; }

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p "$PROJECT_DIR" assembleDebug

      - name: Find and rename APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)"
          test -n "$APK" || { echo "::error::Build finished but no debug APK was found"; find "$PROJECT_DIR" -type f -name '*.apk'; exit 1; }
          mkdir -p output
          cp "$APK" output/HykonSolar-Neo.apk
          ls -lh output/HykonSolar-Neo.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HykonSolar-Neo-apk
          path: output/HykonSolar-Neo.apk
          if-no-files-found: error
          retention-days: 30
          
