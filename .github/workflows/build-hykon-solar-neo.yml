
name: Build Hykon Solar Neo APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HykonSolar-Neo-Complete-Redesign.zip'
      - '.github/workflows/build-hykon-solar-neo.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project ZIP
        run: |
          test -f HykonSolar-Neo-Complete-Redesign.zip
          mkdir -p build-src
          unzip -q HykonSolar-Neo-Complete-Redesign.zip -d build-src
          test -f build-src/HykonSolar/app/build.gradle.kts

      - name: Build debug APK
        working-directory: build-src/HykonSolar
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        run: |
          mkdir -p output
          cp build-src/HykonSolar/app/build/outputs/apk/debug/app-debug.apk output/HykonSolar-Neo.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HykonSolar-Neo-apk
          path: output/HykonSolar-Neo.apk
          if-no-files-found: error
          retention-days: 30
