
name: Build Hykon Solar Neo

on:
  workflow_dispatch:
  push:
    paths:
      - 'HykonSolar-Neo-Complete-Redesign-FRESH.zip'
      - '.github/workflows/build-hykon-solar-neo.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Extract source ZIP
        run: |
          mkdir -p source
          unzip -q HykonSolar-Neo-Complete-Redesign-FRESH.zip -d source
          find source -name gradlew -type f

      - name: Locate Android project
        id: project
        run: |
          PROJECT_DIR=$(dirname "$(find source -name settings.gradle.kts -type f | head -n 1)")
          test -n "$PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          APK=$(find source -path '*/build/outputs/apk/debug/*.apk' -type f | head -n 1)
          test -n "$APK"
          cp "$APK" output/HykonSolar-Neo.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HykonSolar-Neo-apk
          path: output/HykonSolar-Neo.apk
          if-no-files-found: error
          retention-days: 30
          
