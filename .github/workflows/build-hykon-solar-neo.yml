name: Build Hykon Solar Neo APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'HykonSolar-Neo-Separate-App.zip'
      - '.github/workflows/build-hykon-solar-neo.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify and extract project ZIP
        run: |
          test -f HykonSolar-Neo-Separate-App.zip || { echo 'ZIP file not found. Upload HykonSolar-Neo-Separate-App.zip to the repository root.'; exit 1; }
          unzip -q HykonSolar-Neo-Separate-App.zip -d extracted
          test -f extracted/HykonSolar/settings.gradle.kts || { echo 'Unexpected ZIP structure: expected HykonSolar/settings.gradle.kts'; exit 1; }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p extracted/HykonSolar assembleDebug

      - name: Rename APK
        run: |
          mkdir -p output
          cp extracted/HykonSolar/app/build/outputs/apk/debug/app-debug.apk output/HykonSolar-Neo.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HykonSolar-Neo-apk
          path: output/HykonSolar-Neo.apk
          if-no-files-found: error
