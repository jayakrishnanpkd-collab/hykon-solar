
name: Build Hykon Solar Neo APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HykonSolar-Neo-Complete-Redesign-FRESH.zip'
      - '.github/workflows/build-hykon-solar-neo.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Hykon Solar Neo
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licences
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android SDK 34
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          ZIP="HykonSolar-Neo-Complete-Redesign-FRESH.zip"
          test -f "$ZIP"
          mkdir -p source
          unzip -q "$ZIP" -d source

          PROJECT=$(find source -name settings.gradle.kts \
            -type f -printf '%h\n' | head -n 1)

          test -n "$PROJECT"
          test -f "$PROJECT/app/build.gradle.kts"

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT"

      - name: Build Android APK
        run: |
          gradle --no-daemon --stacktrace \
            -p "$PROJECT_DIR" assembleDebug

      - name: Rename APK
        shell: bash
        run: |
          set -e
          APK=$(find "$PROJECT_DIR" \
            -path '*/build/outputs/apk/debug/*.apk' \
            -type f | head -n 1)

          test -n "$APK"
          mkdir -p output
          cp "$APK" output/HykonSolar-Neo.apk

          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HykonSolar-Neo-apk
          path: output/HykonSolar-Neo.apk
          if-no-files-found: error
          retention-days: 30
